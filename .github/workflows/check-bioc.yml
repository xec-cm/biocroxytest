name: R-CMD-check-bioc

on:
  push:
    branches: [devel]
  pull_request:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-bioc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  bioc_version: bioc-devel

jobs:
  bioc-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-bioc-matrix.outputs.matrix }}
    steps:
      - id: set-bioc-matrix
        shell: bash
        run: |
          bioc=$(curl --retry 3 -fsSL https://bioconductor.org/config.yaml)
          bioc_config_value() {
            printf '%s\n' "$bioc" | awk -F': ' -v key="$1" '$1 == key { gsub(/"/, "", $2); print $2; exit }'
          }
          r_major_minor() {
            printf '%s\n' "$1" | grep -Eo '^[0-9]+\.[0-9]+'
          }
          if [[ "$bioc_version" == "bioc-release" ]]; then
            biocversion=$(bioc_config_value release_version)
            r_expected=$(r_major_minor "$(bioc_config_value r_version_associated_with_release)")
            rversion="$r_expected"
            bioccont="bioconductor/bioconductor_docker:RELEASE_${biocversion/./_}"
          elif [[ "$bioc_version" == "bioc-devel" ]]; then
            biocversion=$(bioc_config_value devel_version)
            r_expected=$(r_major_minor "$(bioc_config_value r_version_associated_with_devel)")
            r_release=$(r_major_minor "$(bioc_config_value r_version_associated_with_release)")
            rversion="$r_expected"
            if [[ "$r_expected" != "$r_release" ]]; then
              rversion=devel
            fi
            bioccont=bioconductor/bioconductor_docker:devel
          else
            biocversion="$bioc_version"
            r_expected=$(printf '%s\n' "$bioc" | sed -n '/^r_ver_for_bioc_ver:/,/^release_dates:/p' | awk -F': ' -v key="  \"${biocversion}\"" '$1 == key { gsub(/"/, "", $2); print $2; exit }')
            r_expected=$(r_major_minor "$r_expected")
            rversion="$r_expected"
            bioccont="bioconductor/bioconductor_docker:RELEASE_${biocversion/./_}"
          fi
          if [[ ! "$biocversion" =~ ^[0-9]+\.[0-9]+$ || ! "$r_expected" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Could not resolve a compatible R/Bioconductor pair.'
            exit 1
          fi
          echo "Bioconductor $biocversion with R $rversion (expected $r_expected)"
          echo "matrix={\"config\":[{\"os\":\"ubuntu-latest\",\"r\":\"$rversion\",\"r_expected\":\"$r_expected\",\"bioc\":\"$biocversion\",\"cont\":\"$bioccont\"},{\"os\":\"macos-latest\",\"r\":\"$rversion\",\"r_expected\":\"$r_expected\",\"bioc\":\"$biocversion\"},{\"os\":\"windows-latest\",\"r\":\"$rversion\",\"r_expected\":\"$r_expected\",\"bioc\":\"$biocversion\"}]}" >> "$GITHUB_OUTPUT"

  build-check:
    needs: bioc-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.bioc-config.outputs.matrix) }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    env:
      NOT_CRAN: 'true'
      TZ: UTC
      R_BIOC_VERSION: ${{ matrix.config.bioc }}
      EXPECTED_R_VERSION: ${{ matrix.config.r_expected }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup R
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup Pandoc
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Verify R version
        run: |
          actual <- paste(R.version$major, strsplit(R.version$minor, ".", fixed = TRUE)[[1]][1], sep = ".")
          stopifnot(identical(actual, Sys.getenv("EXPECTED_R_VERSION")))
        shell: Rscript {0}

      - name: Install package and check dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache-version: bioc-${{ matrix.config.bioc }}
          extra-packages: |
            any::rcmdcheck
            bioc::BiocCheck
            bioc::BiocVersion
            any::BiocManager
            any::sessioninfo
            ${{ runner.os == 'Linux' && 'any::covr' || '' }}
            ${{ runner.os == 'Linux' && 'any::pkgdown' || '' }}

      - name: Verify Bioconductor version and record session
        run: |
          installed_bioc <- as.character(utils::packageVersion("BiocVersion")[, 1:2])
          stopifnot(identical(installed_bioc, Sys.getenv("R_BIOC_VERSION")))
          sessioninfo::session_info()
        shell: Rscript {0}

      - name: Validate pkgdown configuration
        if: runner.os == 'Linux'
        run: pkgdown::check_pkgdown(".")
        shell: Rscript {0}

      - name: Run CMD check
        env:
          _R_CHECK_CRAN_INCOMING_: 'false'
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--timings"),
            build_args = c("--no-manual", "--keep-empty-dirs", "--no-resave-data"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Reveal testthat details
        if: always()
        run: |
          logs <- list.files("check", pattern = "^testthat\\.Rout(\\.fail)?$", recursive = TRUE, full.names = TRUE)
          for (log in logs) cat(readLines(log, warn = FALSE), sep = "\n")
        shell: Rscript {0}

      - name: Run BiocCheck
        run: |
          BiocCheck::BiocCheck(
            dir("check", "[.]tar[.]gz$", full.names = TRUE),
            `quit-with-status` = TRUE,
            `no-check-R-ver` = TRUE,
            `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}

      - name: Measure test coverage
        if: runner.os == 'Linux'
        run: |
          coverage <- covr::package_coverage(type = "tests")
          covr::to_cobertura(coverage, filename = "coverage.xml")
        shell: Rscript {0}

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build pkgdown site
        if: runner.os == 'Linux'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}

      - name: Upload pkgdown site
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel' && runner.os == 'Linux'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os }}-${{ matrix.config.r }}-${{ matrix.config.bioc }}-results
          path: check
          if-no-files-found: warn
          retention-days: 7

  deploy-pkgdown:
    name: Deploy pkgdown site
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pkgdown site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
