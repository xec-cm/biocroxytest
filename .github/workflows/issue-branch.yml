name: Create Issue Branch

on:
  issues:
    types: [assigned]

concurrency:
  group: issue-branch-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create_issue_branch_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create Issue Branch
        uses: robvanderleek/create-issue-branch@d102436e2ed937ecbaf36e8d59fe13f61dd7b653 # Same revision as dar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
